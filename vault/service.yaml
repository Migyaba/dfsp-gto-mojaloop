apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfsp.vault.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dfsp.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      protocol: TCP
  selector:
    {{- include "dfsp.selectorLabels" (merge (dict "component" "vault") .) | nindent 4 }}
